apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: dashboard-gateway
  namespace: lazy-typing
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  gatewayClassName: envoy
  listeners:
    - name: https
      protocol: HTTPS
      port: 443
      hostname: dashboard.example.com
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: dashboard-tls
      allowedRoutes:
        namespaces:
          from: Same
